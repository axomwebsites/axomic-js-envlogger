<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>axomic js envlogger</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#f8f9fa;color:#212529;font-family:'Segoe UI','Fira Code',monospace;padding:24px 20px;transition:background .2s,color .2s}
    body.dark{background:#1e1e2f;color:#e2e8f0}
    body.dark .panel,body.dark .envcard,body.dark button,body.dark select{background:#2a2a3a;border-color:#3a3a4a}
    body.dark textarea{background:#0f0f1a;color:#e2e8f0}
    body.blue{background:#e6f0ff;color:#003366}
    body.blue .panel,body.blue .envcard,body.blue button,body.blue select{background:#d4e4ff;border-color:#a0c4ff}
    body.blue textarea{background:#c2d9ff;color:#003366}
    .container{max-width:1600px;margin:0 auto}
    h1{font-size:1.8rem;font-weight:600;margin-bottom:6px}
    .sub{font-size:.75rem;opacity:.7;margin-bottom:24px;border-left:3px solid #0d6efd;padding-left:12px}
    .toolbar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:22px;align-items:center}
    select,button{background:#fff;border:1px solid #dee2e6;padding:6px 16px;font-family:monospace;font-size:.8rem;cursor:pointer;border-radius:30px}
    button.primary{background:#0d6efd;color:#fff;border-color:#0d6efd}
    .flexrow{display:flex;gap:20px;flex-wrap:wrap}
    .panel{flex:1;min-width:300px;background:#fff;border:1px solid #dee2e6;border-radius:20px;overflow:hidden;margin-bottom:24px}
    .panelhead{background:#f1f3f5;padding:10px 18px;border-bottom:1px solid #dee2e6;font-size:.75rem;font-weight:600;display:flex;justify-content:space-between}
    textarea{width:100%;background:#e9ecef;border:none;font-family:'Courier New',monospace;font-size:12px;line-height:1.45;padding:16px;resize:vertical;outline:none}
    textarea:focus{outline:1px solid #0d6efd}
    .envcard{background:#fff;border:1px solid #dee2e6;border-radius:20px;margin-top:16px}
    .envhead{background:#f1f3f5;padding:8px 18px;font-size:.7rem;border-bottom:1px solid #dee2e6}
    pre{margin:0;padding:14px;overflow-x:auto;font-size:11px;background:#e9ecef;max-height:260px}
    .badge{background:#e9ecef;padding:2px 10px;border-radius:30px;font-size:.7rem}
    .checkbox-row{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin:8px 0}
    .checkbox-row label{display:flex;align-items:center;gap:4px;font-size:.75rem}
    #status{font-size:.8rem;color:#6c757d;margin-left:12px}
  </style>
</head>
<body>
<div class="container">
  <div style="display:flex;justify-content:space-between;align-items:baseline">
    <div><h1>axomic js envlogger</h1><div class="sub">full deobfuscation · ast transforms · env logging · obfuscator.io support</div></div>
    <div><label>theme:</label><select id="themesel"><option value="light">light</option><option value="dark">dark</option><option value="blue">blue</option></select></div>
  </div>
  <div class="toolbar">
    <button id="runbtn" class="primary">env log & deobfuscate</button>
    <label for="fileup" style="background:#fff;padding:6px 16px;border-radius:30px;cursor:pointer;border:1px solid #dee2e6">upload .js</label>
    <input type="file" id="fileup" accept=".js,.txt" style="display:none">
    <button id="clearbtn">clear</button>
    <button id="samplebtn">load sample</button>
    <span id="status">ready</span>
  </div>
  <div class="flexrow">
    <div class="panel"><div class="panelhead"><span>obfuscated input</span><span id="inputstat" class="badge">0 chars</span></div><textarea id="inputcode" rows="14"></textarea></div>
    <div class="panel"><div class="panelhead"><span>deobfuscated output</span><div><button id="copyout" style="padding:2px 12px;">copy</button><button id="downloadout" style="padding:2px 12px;">save</button></div></div><textarea id="outputcode" readonly rows="14"></textarea></div>
  </div>
  <div class="envcard"><div class="envhead">environment snapshot</div><pre id="envpre">ready</pre></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/acorn/8.11.3/acorn.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/acorn-walk/8.3.2/walk.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/escodegen/2.1.0/escodegen.min.js"></script>
<script>
(function(){
  const themesel=document.getElementById('themesel');
  const docbody=document.body;
  themesel.addEventListener('change',function(e){
    docbody.classList.remove('dark','blue');
    if(e.target.value!=='light') docbody.classList.add(e.target.value);
  });
  const inp=document.getElementById('inputcode');
  const out=document.getElementById('outputcode');
  const envpre=document.getElementById('envpre');
  const runbtn=document.getElementById('runbtn');
  const fileup=document.getElementById('fileup');
  const clrbtn=document.getElementById('clearbtn');
  const sampbtn=document.getElementById('samplebtn');
  const copybtn=document.getElementById('copyout');
  const dwnbtn=document.getElementById('downloadout');
  const instat=document.getElementById('inputstat');
  const statusEl=document.getElementById('status');
  function updstat(){instat.innerText=inp.value.length+' chars';}
  inp.addEventListener('input',updstat);
  updstat();
  function capenv(){
    const e={};
    if(typeof window!=='undefined'){
      e.ua=navigator.userAgent;
      e.plat=navigator.platform;
      e.lang=navigator.language;
      e.hwcon=navigator.hardwareConcurrency;
      e.wd=navigator.webdriver;
      e.url=location.href;
      e.screen=screen.width+'x'+screen.height;
    }
    if(typeof process!=='undefined') e.nodever=process.version;
    e.now=Date.now();
    return e;
  }
  function safeval(ex){try{return new Function('return ('+ex+')')();}catch(e){return null;}}
  const OBFUSCATOR_IO_DEOP = {
    version: '1.0.6',
    deobfuscate: function(code) {
      let result = code;
      try {
        result = this._extractStringArray(result);
        result = this._resolveProxyCalls(result);
        result = this._flattenControlFlow(result);
        result = this._removeDeadCode(result);
        result = this._simplifyExpressions(result);
        result = this._renameIdentifiers(result);
      } catch(e) {
        return '// deobfuscation error: ' + e.message + '\n' + result;
      }
      return result;
    },
    _extractStringArray: function(code) {
      const ast = this._parse(code);
      if(!ast) return code;
      const strings = new Map();
      const walk=acorn.walk;
      walk.simple(ast, {
        VariableDeclaration: function(n) {
          for(const d of n.declarations) {
            if(d.init && d.init.type === 'ArrayExpression') {
              const name = d.id.name;
              const elems = d.init.elements.map(function(e) {
                if(e.type === 'Literal') return e.value;
                if(e.type === 'UnaryExpression' && e.operator === '-' && e.argument.type === 'Literal') return -e.argument.value;
                return null;
              });
              if(elems.every(function(v){return v !== null;})) strings.set(name, elems);
            }
          }
        }
      });
      if(strings.size === 0) return code;
      const reps = [];
      walk.simple(ast, {
        MemberExpression: function(n) {
          if(n.object.type === 'Identifier' && strings.has(n.object.name)) {
            if(n.property.type === 'Literal' && typeof n.property.value === 'number') {
              const idx = n.property.value;
              const arr = strings.get(n.object.name);
              if(idx >= 0 && idx < arr.length) reps.push({node:n, val:arr[idx]});
            }
          }
        }
      });
      for(const r of reps) {
        const par = r.node.parent;
        const key = r.node.key;
        if(par) par[key] = {type:'Literal', value:r.val};
      }
      return this._generate(ast);
    },
    _resolveProxyCalls: function(code) {
      const ast = this._parse(code);
      if(!ast) return code;
      const walk=acorn.walk;
      const reps = [];
      walk.simple(ast, {
        CallExpression: function(n) {
          if(n.callee.type === 'Identifier' && n.callee.name.startsWith('_0x')) {
            if(n.arguments.length === 1 && n.arguments[0].type === 'Literal') {
              const idx = n.arguments[0].value;
              if(typeof idx === 'number') {
                reps.push({node:n, idx:idx});
              }
            }
          }
        }
      });
      for(const r of reps) {
        try {
          const val = safeval('_0x' + r.idx);
          if(val !== null) {
            const par = r.node.parent;
            const key = r.node.key;
            if(par) par[key] = {type:'Literal', value:val};
          }
        } catch(e) {}
      }
      return this._generate(ast);
    },
    _flattenControlFlow: function(code) {
      const ast = this._parse(code);
      if(!ast) return code;
      const walk=acorn.walk;
      walk.simple(ast, {
        WhileStatement: function(n) {
          if(n.test.type === 'Literal' && n.test.value === true) {
            const body = n.body;
            if(body.type === 'BlockStatement') {
              const stmts = body.body;
              if(stmts.length >= 2) {
                const first = stmts[0];
                const second = stmts[1];
                if(first.type === 'VariableDeclaration' && second.type === 'SwitchStatement') {
                  const stateVar = first.declarations[0].id.name;
                  const cases = second.cases;
                  const cmap = new Map();
                  let defblock = null;
                  for(const c of cases) {
                    if(c.test && c.test.type === 'Literal' && typeof c.test.value === 'number') {
                      const num = c.test.value;
                      const block = c.consequent.slice(0);
                      const last = block[block.length - 1];
                      if(last && last.type === 'BreakStatement') block.pop();
                      cmap.set(num, block);
                    } else {
                      defblock = c.consequent.slice(0);
                      const last = defblock[defblock.length - 1];
                      if(last && last.type === 'BreakStatement') defblock.pop();
                    }
                  }
                  const keys = Array.from(cmap.keys()).sort((a,b)=>a-b);
                  let allstmts = [];
                  for(const k of keys) allstmts.push(...cmap.get(k));
                  if(defblock) allstmts.push(...defblock);
                  const par = n.parent;
                  const key = n.key;
                  if(par) par[key] = {type:'BlockStatement', body:allstmts};
                }
              }
            }
          }
        }
      });
      return this._generate(ast);
    },
    _removeDeadCode: function(code) {
      const ast = this._parse(code);
      if(!ast) return code;
      const walk=acorn.walk;
      const rems = [];
      walk.simple(ast, {
        IfStatement: function(n) {
          if(n.test.type === 'Literal' && n.test.value === false) {
            rems.push({node:n, parent:n.parent, key:n.key});
          }
          if(n.test.type === 'Literal' && n.test.value === true) {
            const par = n.parent;
            const key = n.key;
            if(par) par[key] = n.consequent;
          }
        },
        DebuggerStatement: function(n) {
          rems.push({node:n, parent:n.parent, key:n.key});
        },
        ExpressionStatement: function(n) {
          if(n.expression.type === 'CallExpression') {
            const c = n.expression.callee;
            if(c.type === 'MemberExpression' && c.object.type === 'Identifier' && c.object.name === 'console') {
              rems.push({node:n, parent:n.parent, key:n.key});
            }
          }
        }
      });
      for(const r of rems) {
        const par = r.parent;
        const key = r.key;
        if(par && Array.isArray(par[key])) {
          const idx = par[key].indexOf(r.node);
          if(idx !== -1) par[key].splice(idx, 1);
        } else if(par && par[key] === r.node) {
          par[key] = {type:'EmptyStatement'};
        }
      }
      return this._generate(ast);
    },
    _simplifyExpressions: function(code) {
      const ast = this._parse(code);
      if(!ast) return code;
      const walk=acorn.walk;
      let changed = true;
      while(changed) {
        changed = false;
        walk.simple(ast, {
          BinaryExpression: function(n) {
            if(n.left.type === 'Literal' && n.right.type === 'Literal') {
              const l = n.left.value;
              const r = n.right.value;
              let res;
              switch(n.operator) {
                case '+': res = l + r; break;
                case '-': res = l - r; break;
                case '*': res = l * r; break;
                case '/': res = l / r; break;
                case '%': res = l % r; break;
                case '**': res = l ** r; break;
                case '===': res = l === r; break;
                case '!==': res = l !== r; break;
                case '==': res = l == r; break;
                case '!=': res = l != r; break;
                case '>': res = l > r; break;
                case '<': res = l < r; break;
                case '>=': res = l >= r; break;
                case '<=': res = l <= r; break;
                case '|': res = l | r; break;
                case '&': res = l & r; break;
                case '^': res = l ^ r; break;
                case '<<': res = l << r; break;
                case '>>': res = l >> r; break;
                case '>>>': res = l >>> r; break;
                default: return;
              }
              const nl = {type:'Literal', value:res};
              const par = n.parent;
              const key = n.key;
              if(par){par[key]=nl; changed=true;}
            }
          },
          UnaryExpression: function(n) {
            if(n.argument.type === 'Literal') {
              const v = n.argument.value;
              let res;
              switch(n.operator) {
                case '-': res = -v; break;
                case '+': res = +v; break;
                case '!': res = !v; break;
                case '~': res = ~v; break;
                case 'typeof': res = typeof v; break;
                default: return;
              }
              const nl = {type:'Literal', value:res};
              const par = n.parent;
              const key = n.key;
              if(par){par[key]=nl; changed=true;}
            }
          },
          LogicalExpression: function(n) {
            if(n.left.type === 'Literal' && n.right.type === 'Literal') {
              const l = n.left.value;
              const r = n.right.value;
              let res;
              switch(n.operator) {
                case '&&': res = l && r; break;
                case '||': res = l || r; break;
                case '??': res = l ?? r; break;
                default: return;
              }
              const nl = {type:'Literal', value:res};
              const par = n.parent;
              const key = n.key;
              if(par){par[key]=nl; changed=true;}
            }
          }
        });
      }
      return this._generate(ast);
    },
    _renameIdentifiers: function(code) {
      const reserved = new Set(['true','false','null','undefined','NaN','Infinity','this','arguments','eval','function','return','var','let','const','if','else','for','while','do','switch','case','break','continue','try','catch','finally','throw','new','typeof','instanceof','in','delete','void','with','debugger','class','extends','super','import','export','default','static','yield','await','of','from','as','get','set','object','array','string','number','boolean','json','math','date','regexp','promise','fetch','console','navigator','window','document','atob','btoa']);
      const used = new Set();
      const map = new Map();
      let cnt = 0;
      function next(){
        cnt++;
        let n = '';
        let c = cnt;
        while(c > 0){
          const rem = (c - 1) % 26;
          n = String.fromCharCode(97 + rem) + n;
          c = Math.floor((c - 1) / 26);
        }
        return n;
      }
      const ast = this._parse(code);
      if(!ast) return code;
      const walk=acorn.walk;
      walk.simple(ast, {
        Identifier: function(n) {
          if(reserved.has(n.name)) return;
          const low = n.name.toLowerCase();
          if(!map.has(low)){
            let nn = next();
            while(used.has(nn)) nn = next();
            used.add(nn);
            map.set(low, nn);
          }
          n.name = map.get(low);
        }
      });
      return this._generate(ast);
    },
    _parse: function(code) {
      try {
        return acorn.parse(code, {ecmaVersion: 2022, sourceType: 'script'});
      } catch(e) {
        try {
          return acorn.parse(code, {ecmaVersion: 2022, sourceType: 'module'});
        } catch(e2) {
          return null;
        }
      }
    },
    _generate: function(ast) {
      return escodegen.generate(ast, {format:{indent:'  ', semicolons:true}});
    }
  };
  function deobfuscateCode(code) {
    let result = code;
    try {
      result = OBFUSCATOR_IO_DEOP.deobfuscate(result);
    } catch(e) {
      return '// deobfuscation error: ' + e.message + '\n' + result;
    }
    return result;
  }
  async function run(){
    const src = inp.value;
    if(!src.trim()){
      out.value = 'no input';
      envpre.innerText = 'empty';
      return;
    }
    out.value = 'processing...';
    statusEl.innerText = 'deobfuscating...';
    const env = capenv();
    envpre.innerText = JSON.stringify(env, null, 2);
    try {
      const start = Date.now();
      const res = deobfuscateCode(src);
      const elapsed = Date.now() - start;
      out.value = res;
      statusEl.innerText = 'done in ' + elapsed + 'ms';
    } catch(e) {
      out.value = 'fatal: ' + e.message;
      statusEl.innerText = 'error';
    }
  }
  runbtn.addEventListener('click', run);
  clrbtn.addEventListener('click', function(){
    inp.value = '';
    out.value = '';
    envpre.innerText = 'cleared';
    statusEl.innerText = 'ready';
    updstat();
  });
  sampbtn.addEventListener('click', function(){
    inp.value = 'var _0x1234 = ["hello", "world"];\nvar _0x5678 = function(_0x9abc) { return _0x1234[_0x9abc]; };\nvar a = _0x5678(0) + " " + _0x5678(1);\nconsole.log(a);\nif(false){ var x = 1; }\ndebugger;\nwhile(true){ var state = 0; switch(state){ case 0: state = 1; break; case 1: break; } }';
    updstat();
    out.value = '';
    envpre.innerText = 'sample loaded. click deobfuscate.';
    statusEl.innerText = 'sample loaded';
  });
  fileup.addEventListener('change', function(e){
    const f = e.target.files[0];
    if(!f) return;
    const r = new FileReader();
    r.onload = function(ev){
      inp.value = ev.target.result;
      updstat();
      statusEl.innerText = 'file loaded';
    };
    r.readAsText(f);
    fileup.value = '';
  });
  copybtn.addEventListener('click', async function(){
    if(!out.value) return;
    await navigator.clipboard.writeText(out.value);
    const old = copybtn.innerText;
    copybtn.innerText = 'copied';
    setTimeout(function(){ copybtn.innerText = old; }, 1200);
  });
  dwnbtn.addEventListener('click', function(){
    if(!out.value) return;
    const blob = new Blob([out.value], {type:'text/javascript'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'deobfuscated.js';
    a.click();
    URL.revokeObjectURL(a.href);
  });
  updstat();
})();
</script>
</body>
</html>
