<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Env Log</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/acorn/8.10.0/acorn.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body class="dark">
    <div class="container">
        <header>
            <h1>Env Log</h1>
            <small>made by axom</small>
            <div class="themeselector">
                <select id="themeselect" onchange="changetheme(this.value)">
                    <option value="dark">Dark Mode</option>
                    <option value="bright">Bright Mode</option>
                    <option value="glass">Glassmorphism</option>
                    <option value="terminal">Terminal</option>
                    <option value="cyber">Cyberpunk</option>
                </select>
            </div>
        </header>
        
        <div class="inputsection">
            <textarea id="inputcode" placeholder="Paste obfuscated JavaScript code here..."></textarea>
            <div class="buttongroup">
                <button onclick="importfile()">Import from File/Zip</button>
                <input type="file" id="fileinput" style="display:none" accept=".js,.txt,.zip" onchange="handlefile(event)">
            </div>
        </div>
        
        <button class="processbtn" onclick="processcode()">Process Code</button>
        
        <div class="outputsection">
            <textarea id="outputcode" readonly placeholder="Deobfuscated output will appear here..."></textarea>
            <div class="outputbuttons">
                <button onclick="copycode()">Copy</button>
                <button onclick="toggledownload()">Download (As File)</button>
                <div id="downloadoptions" class="downloadoptions" style="display:none">
                    <button onclick="downloadfile('txt')">Download as .txt</button>
                    <button onclick="downloadfile('js')">Download as .js</button>
                </div>
            </div>
        </div>
        
        <footer>
            <p class="warning">you are responsible for your use of this JavaScript env logger.</p>
        </footer>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
