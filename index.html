<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Env Log</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/gh/axom0022/axomcss@main/axomcss.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Env Log</h1>
            <small>made by axom</small>
        </header>
        
        <div class="input-section">
            <textarea id="var1" placeholder="Paste obfuscated JavaScript code here..."></textarea>
            <div class="button-group">
                <button onclick="var3()">Import from File/Zip</button>
                <input type="file" id="var2" style="display:none" accept=".js,.txt,.zip" onchange="var4(event)">
            </div>
        </div>
        
        <button class="process-btn" onclick="var5()">Process Code</button>
        
        <div class="output-section">
            <textarea id="var6" readonly placeholder="Deobfuscated output will appear here..."></textarea>
            <div class="output-buttons">
                <button onclick="var7()">Copy</button>
                <button onclick="var8()">Download (As File)</button>
                <div id="var9" class="download-options" style="display:none">
                    <button onclick="var10('txt')">Download as .txt</button>
                    <button onclick="var10('js')">Download as .js</button>
                </div>
            </div>
        </div>
        
        <footer>
            <p class="warning">you are responsible for your use of this JavaScript env logger.</p>
        </footer>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
